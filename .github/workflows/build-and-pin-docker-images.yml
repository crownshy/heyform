name: build-and-pin-docker-images

on:
  push:
    branches:
      - comhairle
  workflow_dispatch:
    inputs:
      dry_run:
        description: When true, do not push images or pin manifests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-image:
    if: github.ref == 'refs/heads/comhairle' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crownshy/heyform
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin-manifests:
    if: github.ref == 'refs/heads/comhairle'
    needs:
      - build-image
    runs-on: ubuntu-latest
    env:
      PIN_REF: ${{ github.sha }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      GITOPS_REPO: crownshy/helm_charts
      GITOPS_FILE_PATH: heyform/values.yaml
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pin
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/${GITOPS_REPO}"
          COMMON_HEADERS=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GITOPS_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          repo_info="$(curl -fsSL "${COMMON_HEADERS[@]}" "${API_URL}")"
          default_branch="$(jq -r '.default_branch' <<<"${repo_info}")"

          content_obj="$(curl -fsSL "${COMMON_HEADERS[@]}" "${API_URL}/contents/${GITOPS_FILE_PATH}?ref=${default_branch}")"
          current_sha="$(jq -r '.sha' <<<"${content_obj}")"
          current_text="$(jq -r '.content' <<<"${content_obj}" | tr -d '\n' | base64 -d)"

          current_pin="$(printf '%s\n' "${current_text}" | sed -nE 's/^\s+tag:\s*"?([^"[:space:]]+)"?\s*$/\1/p' | head -n1)"

          if [[ -z "${current_pin}" ]]; then
            echo "Could not find image.tag in ${GITOPS_FILE_PATH}" >&2
            exit 1
          fi

          if [[ "${current_pin}" == "${PIN_REF}" ]]; then
            echo "Pin already up to date; no commit needed."
            exit 0
          fi

          updated_text="$(printf '%s\n' "${current_text}" | awk -v pin="${PIN_REF}" '
            $0 ~ /^  tag:/ { print "  tag: \"" pin "\""; next }
            { print }
          ')"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run enabled. Skipping pin commit update."
            exit 0
          fi

          encoded_content="$(printf '%s' "${updated_text}" | base64 -w 0)"

          update_payload="$(jq -n \
            --arg message "Pin heyform image to ${PIN_REF}" \
            --arg content "${encoded_content}" \
            --arg sha "${current_sha}" \
            --arg branch "${default_branch}" \
            '{
              message: $message,
              content: $content,
              sha: $sha,
              branch: $branch
            }')"

          curl -fsSL -X PUT "${COMMON_HEADERS[@]}" -d "${update_payload}" "${API_URL}/contents/${GITOPS_FILE_PATH}"
